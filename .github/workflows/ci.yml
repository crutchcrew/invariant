name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Lockfile drift
        run: bun lockfile:check

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Generate badges
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p .badges

          # Extract coverage % from bun test output
          COVERAGE=$(bun test --coverage 2>&1 | grep 'All files' | awk '{print $4}')
          if [ $(echo "$COVERAGE >= 90" | bc) -eq 1 ]; then COLOR="brightgreen"
          elif [ $(echo "$COVERAGE >= 70" | bc) -eq 1 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > .badges/coverage.json

          # Measure gzip size of dist/index.js
          GZIP_BYTES=$(gzip -c dist/index.js | wc -c | tr -d ' ')
          if [ "$GZIP_BYTES" -lt 1024 ]; then
            SIZE_LABEL="${GZIP_BYTES} B"
          else
            SIZE_LABEL="$(echo "scale=1; $GZIP_BYTES / 1024" | bc) kB"
          fi
          echo "{\"schemaVersion\":1,\"label\":\"gzip size\",\"message\":\"${SIZE_LABEL}\",\"color\":\"blue\"}" > .badges/size.json

      - name: Deploy badges
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .badges
          destination_dir: badges
          keep_files: true
