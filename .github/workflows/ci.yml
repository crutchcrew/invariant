name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Lockfile drift
        run: bun lockfile:check

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test:coverage

      - name: Build
        run: bun run build
